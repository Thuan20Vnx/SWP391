name: Keep Render awake

# Ping backend trên Render mỗi 10 phút để tránh free-tier "ngủ".
# Cần đặt biến repo: Settings → Secrets and variables → Actions → Variables →
#   New variable: RENDER_PING_URL = https://<ten-be>.onrender.com
# (Dùng Variable, không phải Secret, để log thấy được URL khi debug.)

on:
  schedule:
    - cron: '*/10 * * * *'   # mỗi 10 phút (giờ UTC)
  workflow_dispatch:          # cho phép bấm chạy tay để test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          URL="${{ vars.RENDER_PING_URL }}"
          if [ -z "$URL" ]; then
            echo "Chưa đặt biến RENDER_PING_URL — bỏ qua."
            exit 0
          fi
          echo "Pinging $URL"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
          echo "HTTP $code"
          # Render đang wake-up có thể trả 502/503 lần đầu — vẫn coi là đã đánh thức.
          case "$code" in
            2*|3*|404|502|503) echo "OK (đã đánh thức)"; exit 0 ;;
            *) echo "Ping thất bại (HTTP $code)"; exit 1 ;;
          esac
