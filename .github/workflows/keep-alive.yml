name: Keep Render awake

# Ping BE (Render) và FE (Vercel) mỗi 7 phút để tránh free-tier "ngủ".
# Đặt biến repo: Settings → Secrets and variables → Actions → Variables →
#   RENDER_PING_URL = https://<ten-be>.onrender.com
#   VERCEL_PING_URL = https://<ten-fe>.vercel.app   (tùy chọn)
# (Dùng Variable, không phải Secret, để log thấy được URL khi debug.)

on:
  schedule:
    - cron: '*/7 * * * *'    # mỗi 7 phút (giờ UTC)
  workflow_dispatch:          # cho phép bấm chạy tay để test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping targets
        run: |
          ping_one () {
            local name="$1" url="$2"
            if [ -z "$url" ]; then
              echo "[$name] chưa đặt URL — bỏ qua."
              return 0
            fi
            echo "[$name] pinging $url"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url" || echo "000")
            echo "[$name] HTTP $code"
            # Dịch vụ đang wake-up có thể trả 5xx lần đầu — vẫn coi là đã đánh thức.
            case "$code" in
              2*|3*|404|502|503) echo "[$name] OK (đã đánh thức)"; return 0 ;;
              *) echo "[$name] ping thất bại (HTTP $code)"; return 1 ;;
            esac
          }

          fail=0
          ping_one "Render BE" "${{ vars.RENDER_PING_URL }}" || fail=1
          ping_one "Vercel FE" "${{ vars.VERCEL_PING_URL }}" || fail=1
          exit $fail
